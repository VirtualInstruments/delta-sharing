# NOT DEPLOYED -- verified 2026-09-02 (ZING-45349).
#
# zcloud-emea runs no Delta Sharing server: the cluster has neither the delta-sharing-server
# deployment nor the `dl-sharing` Kubernetes service account, and the `dl-sharing` GCP service
# account does not exist in the project. In zing-infrastructure every `dl-sharing` resource
# (zing/modules/zing/zing-svc-service-accounts.tf) is gated on a project list that omits
# zcloud-emea -- the GCP SA, its workload-identity binding, monitoring.metricWriter,
# storage.objectAdmin and serviceAccountTokenCreator -- so GCS access would not work here
# either, not just metrics.
#
# The overlay is kept rather than deleted so the region-specific values (europe-west3) survive
# until Delta Sharing is actually rolled out to EMEA. Widen that Terraform gating first; nothing
# in this file takes effect before then.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-sharing-base-config
  namespace: default
data:
  base-config.yaml: |
    version: 1
    authorization:
      bearerToken: "BEARER_TOKEN_PLACEHOLDER"
    host: "0.0.0.0"
    port: 8080
    endpoint: "/delta-sharing"
    preSignedUrlTimeoutSeconds: 3600
    deltaTableCacheSize: 100
    stalenessAcceptable: false
    evaluatePredicateHints: false
    evaluateJsonPredicateHints: true
    evaluateJsonPredicateHintsV2: true
    requestTimeoutSeconds: 300
    queryTablePageSizeLimit: 10000
    queryTablePageTokenTtlMs: 259200000
    refreshTokenTtlMs: 3600000
    accessLogging:
      enabled: true
      sourceRegion: "europe-west3"
      detectGcpTraffic: true
      clientRegionHeader: "x-client-region"
      clientIpHeader: "x-forwarded-for"
    # Query performance metrics pushed to Google Cloud Monitoring. Stays disabled: `dl-sharing`
    # does not exist in zcloud-emea, so there is no identity to write metrics with. See the
    # NOT DEPLOYED note at the top of this file (ZING-45349).
    metrics:
      enabled: false
      exporter: "stackdriver"
      projectId: "GCP_PROJECT_ID_PLACEHOLDER"
      exportIntervalSeconds: 60
      resourceType: "generic_task"
      location: "europe-west3"
      namespace: "delta-sharing"
      job: "delta-sharing-server"
      # Adds a `tenant` label to request metrics. Each tenant multiplies the number of billed
      # Cloud Monitoring time series, so turn it on deliberately.
      tenantLabelEnabled: false
