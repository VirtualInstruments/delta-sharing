apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-sharing-base-config
  namespace: default
data:
  base-config.yaml: |
    version: 1
    authorization:
      bearerToken: "BEARER_TOKEN_PLACEHOLDER"
    host: "0.0.0.0"
    port: 8080
    endpoint: "/delta-sharing"
    preSignedUrlTimeoutSeconds: 3600
    deltaTableCacheSize: 100
    stalenessAcceptable: false
    evaluatePredicateHints: false
    evaluateJsonPredicateHints: true
    evaluateJsonPredicateHintsV2: true
    requestTimeoutSeconds: 300
    queryTablePageSizeLimit: 10000
    queryTablePageTokenTtlMs: 259200000
    refreshTokenTtlMs: 3600000
    accessLogging:
      enabled: true
      sourceRegion: "us-west4"
      detectGcpTraffic: true
      clientRegionHeader: "x-client-region"
      clientIpHeader: "x-forwarded-for"
      deltaTablePath: "gs://zcloud-prod2-dl-v1/datalake/data/tenant/_system"
    # Query performance metrics pushed to Google Cloud Monitoring.
    # PREREQUISITE: the `dl-sharing` GCP service account needs roles/monitoring.metricWriter --
    # without it the exporter makes one failing API call per interval and stores nothing. The
    # binding is declared in zing-infrastructure (zing/modules/zing/zing-svc-service-accounts.tf)
    # and was verified applied in zcloud-prod2 on 2026-09-02 (ZING-45349).
    metrics:
      # Still disabled: zing-dev goes first so the Cloud Monitoring bill can be checked before the
      # rest follow -- custom metrics bill per time series (ZING-45349).
      enabled: false
      exporter: "stackdriver"
      projectId: "GCP_PROJECT_ID_PLACEHOLDER"
      exportIntervalSeconds: 60
      resourceType: "generic_task"
      location: "us-west4"
      namespace: "delta-sharing"
      job: "delta-sharing-server"
      # Adds a `tenant` label to request metrics. Each tenant multiplies the number of billed
      # Cloud Monitoring time series, so turn it on deliberately.
      tenantLabelEnabled: false
